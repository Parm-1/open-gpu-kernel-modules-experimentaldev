name: exp0006-runtime-tools

on:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'scripts/exp0006-preflight.py'
      - 'scripts/build-exp0006.py'
      - 'scripts/render-exp0006-rollback.py'
      - 'docs/runtime/EXP-0006-native-protocol.md'
      - 'docs/runtime/EXP-0006-approval-template.md'
      - '.github/workflows/exp0006-runtime-tools.yml'
  pull_request:
    paths:
      - 'scripts/exp0006-preflight.py'
      - 'scripts/build-exp0006.py'
      - 'scripts/render-exp0006-rollback.py'
      - 'docs/runtime/EXP-0006-native-protocol.md'
      - 'docs/runtime/EXP-0006-approval-template.md'
      - '.github/workflows/exp0006-runtime-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python tools
        run: |
          python3 -m py_compile \
            scripts/exp0006-preflight.py \
            scripts/build-exp0006.py \
            scripts/render-exp0006-rollback.py
      - name: Run deterministic self-tests
        run: |
          python3 scripts/exp0006-preflight.py --self-test
          python3 scripts/build-exp0006.py --self-test
          python3 scripts/render-exp0006-rollback.py --self-test
      - name: Verify preflight command confinement
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path

          path = Path('scripts/exp0006-preflight.py')
          tree = ast.parse(path.read_text())

          class CommandVisitor(ast.NodeVisitor):
              def __init__(self):
                  self.function = None
                  self.direct_runs = []

              def visit_FunctionDef(self, node):
                  previous = self.function
                  self.function = node.name
                  self.generic_visit(node)
                  self.function = previous

              def visit_Call(self, node):
                  func = node.func
                  if (
                      isinstance(func, ast.Attribute)
                      and isinstance(func.value, ast.Name)
                      and func.value.id == 'subprocess'
                      and func.attr in {'run', 'Popen', 'call', 'check_call', 'check_output'}
                  ):
                      self.direct_runs.append((func.attr, self.function, node.lineno))
                  self.generic_visit(node)

          visitor = CommandVisitor()
          visitor.visit(tree)
          assert len(visitor.direct_runs) == 1, visitor.direct_runs
          assert visitor.direct_runs[0][:2] == ('run', 'run_command'), visitor.direct_runs
          source = path.read_text()
          assert 'validate_read_only_command(argv)' in source
          assert 'command is outside the read-only allowlist' in source
          PY
      - name: Validate protocol boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'BLOCKED_PENDING_PREFLIGHT_RECOVERY_REVIEW_AND_EXPLICIT_LOAD_APPROVAL' \
            docs/runtime/EXP-0006-native-protocol.md
          grep -q 'does not grant approval' \
            docs/runtime/EXP-0006-approval-template.md
          grep -q 'unload_nvidia_stack' \
            docs/runtime/EXP-0006-native-protocol.md
