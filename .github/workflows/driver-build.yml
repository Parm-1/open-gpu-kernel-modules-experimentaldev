name: driver-build

on:
  push:
    branches:
      - main
    paths:
      - 'kernel-open/**'
      - 'src/**'
      - 'Makefile'
      - 'version.mk'
      - '.github/workflows/driver-build.yml'
  pull_request:
    paths:
      - 'kernel-open/**'
      - 'src/**'
      - 'Makefile'
      - 'version.mk'
      - '.github/workflows/driver-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies and generic kernel headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential kmod linux-headers-generic
      - name: Select kernel headers
        id: headers
        shell: bash
        run: |
          KDIR=$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -n1)
          test -n "$KDIR"
          echo "kdir=$KDIR" >> "$GITHUB_OUTPUT"
          basename "$KDIR" | sed 's/^linux-headers-//' > driver-build-kernel.txt
      - name: Build modules without installing
        shell: bash
        run: |
          set -euo pipefail
          common=(
            "SYSSRC=${{ steps.headers.outputs.kdir }}"
            "SYSOUT=${{ steps.headers.outputs.kdir }}"
            'NV_BUILD_USER=github-actions'
            'NV_BUILD_HOST=github-actions'
            'KBUILD_BUILD_USER=github-actions'
            'KBUILD_BUILD_HOST=github-actions'
          )
          make clean "${common[@]}"
          make -j2 modules "${common[@]}"
      - name: Validate and record build identity
        shell: bash
        run: |
          set -euo pipefail
          expected_version='610.57.04'
          expected_kernel="$(cat driver-build-kernel.txt)"
          modules=(
            kernel-open/nvidia.ko
            kernel-open/nvidia-modeset.ko
            kernel-open/nvidia-drm.ko
            kernel-open/nvidia-uvm.ko
            kernel-open/nvidia-peermem.ko
          )
          : > driver-build-evidence.txt
          for module in "${modules[@]}"; do
            test -f "$module"
            version="$(modinfo -F version "$module")"
            vermagic="$(modinfo -F vermagic "$module")"
            srcversion="$(modinfo -F srcversion "$module")"
            signer="$(modinfo -F signer "$module")"
            test "$version" = "$expected_version"
            test "${vermagic%% *}" = "$expected_kernel"
            test -n "$srcversion"
            {
              printf 'module=%s\n' "$module"
              printf 'sha256='; sha256sum "$module" | cut -d' ' -f1
              printf 'version=%s\n' "$version"
              printf 'vermagic=%s\n' "$vermagic"
              printf 'srcversion=%s\n' "$srcversion"
              printf 'signer=%s\n\n' "$signer"
            } >> driver-build-evidence.txt
          done
      - name: Clean generated module outputs
        shell: bash
        run: |
          set -euo pipefail
          common=(
            "SYSSRC=${{ steps.headers.outputs.kdir }}"
            "SYSOUT=${{ steps.headers.outputs.kdir }}"
            'NV_BUILD_USER=github-actions'
            'NV_BUILD_HOST=github-actions'
            'KBUILD_BUILD_USER=github-actions'
            'KBUILD_BUILD_HOST=github-actions'
          )
          make clean "${common[@]}"
          test ! -e kernel-open/nvidia.ko
          test ! -e kernel-open/nvidia-modeset.ko
          test ! -e kernel-open/nvidia-drm.ko
          test ! -e kernel-open/nvidia-uvm.ko
          test ! -e kernel-open/nvidia-peermem.ko
      - name: Upload text-only build evidence
        uses: actions/upload-artifact@v4
        with:
          name: driver-build-evidence
          path: |
            driver-build-evidence.txt
            driver-build-kernel.txt
