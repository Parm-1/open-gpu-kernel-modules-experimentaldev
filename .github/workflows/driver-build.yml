name: driver-build

on:
  pull_request:
    paths:
      - 'kernel-open/**'
      - 'src/**'
      - 'Makefile'
      - 'version.mk'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies and generic kernel headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential linux-headers-generic
      - name: Select kernel headers
        id: headers
        shell: bash
        run: |
          KDIR=$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -n1)
          test -n "$KDIR"
          echo "kdir=$KDIR" >> "$GITHUB_OUTPUT"
      - name: Build modules without installing
        run: make modules -j2 SYSSRC='${{ steps.headers.outputs.kdir }}' SYSOUT='${{ steps.headers.outputs.kdir }}'
